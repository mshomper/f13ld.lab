<style>
:root{--bg:#0b0d11;--panel:#10141a;--lane:#12161c;--surface:#191e26;--surface2:#1e242d;--raised:#1b2029;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.12);--text:#e7eaf0;--muted:#a2aab7;--faint:#6c7584;--accent:#8ea8ff;--accent-ink:#0d1530;--accent-bg:rgba(142,168,255,.14);--good:#5fd3ae;--good-bg:rgba(95,211,174,.13);--warn:#f3b955;--warn-bg:rgba(243,185,85,.13);--bad:#f2727a;--bad-bg:rgba(242,114,122,.13);--chosen:#5fd3ae;--hist:#8792ad;--radius:10px;--font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace;--good-fill:#5fd3ae;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
main{max-width:1240px;margin:0 auto;padding:18px 18px 48px}
h1{font-size:21px;font-weight:600;margin:4px 0 8px;line-height:1.3}
h2{font-size:14px;font-weight:600;margin:26px 0 10px;color:var(--text);letter-spacing:.1px}
h3{font-size:14.5px;font-weight:600;margin:0}
p{margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.open{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.decided{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.found{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.superseded,.chip.rejected{text-decoration:line-through}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.btn{font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer}
.btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.18)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
input,textarea{font:inherit;width:100%;max-width:100%;padding:8px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--faint)}
svg{max-width:100%}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:600;font-size:16px}
.brand .mark{width:24px;height:24px}
.brand .repo{color:var(--muted);font-weight:400}
.search{position:relative;flex:0 1 280px;min-width:180px}
.search .icon{position:absolute;left:10px;top:9px;color:var(--faint)}
.search input{padding-left:32px}
.sub{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 0 4px;font-size:12.5px;color:var(--muted)}
.sub .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.ptitle{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--lane);gap:2px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tile{display:grid;place-items:center;aspect-ratio:1.35;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--text);font-family:var(--mono);font-size:12.5px;position:relative;border-top:3px solid var(--c)}
.tile:hover{background:var(--surface2)}
.tile small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--font);font-size:10.5px;color:var(--faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.areas{display:grid;gap:8px}
.area{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.area .pips{display:flex;flex-wrap:wrap;gap:3px}
.area .pips a{width:16px;height:16px;border-radius:4px;background:var(--c);opacity:.85;display:block}
.area .pips a:hover{opacity:1;outline:1px solid var(--text)}
.area .n{color:var(--faint);font-size:12px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;align-items:start}
.lane{background:var(--lane);border:1px solid var(--line);border-radius:var(--radius);padding:10px;border-top:3px solid var(--c);min-width:0}
.lhead{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;padding:2px 2px 10px}
.lhead .icon{color:var(--c)}
.lhead .count{color:var(--faint);font-weight:400}
.lhint{font-size:12px;color:var(--faint);padding:0 2px 8px;margin-top:-6px}
.cards{display:grid;gap:8px}
.dcard{display:grid;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;text-decoration:none;color:var(--text)}
.dcard:hover{background:var(--surface2);border-color:var(--line2)}
.dcard .t{font-weight:500;font-size:13.5px;line-height:1.35}
.dcard .num{font-family:var(--mono);color:var(--faint);font-size:11.5px}
.dcard .line{font-size:12.5px;color:var(--muted);line-height:1.4}
.dcard .line.warn{color:var(--warn)}
.dcard .line.ok{color:var(--good)}
.dcard .chips{display:flex;flex-wrap:wrap;gap:4px}
.dcard .chip{font-size:11px;padding:0 7px}
.map svg{width:100%;height:auto;display:block}
.map a text{fill:var(--text)}
.map a:hover rect{stroke:var(--text)}
.empty{padding:30px;text-align:center;color:var(--faint)}

.more{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line2)}
.more:hover{color:var(--text);border-color:var(--muted)}
.more .chev{transform:rotate(90deg)}
.more.less .chev{transform:rotate(-90deg)}
.dcard .line{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hub-nav{display:flex;gap:8px;align-items:center}.hub-nav a{display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:500;text-decoration:none;transition:border-color .15s,background .15s,color .15s}.hub-nav a[hidden]{display:none}.hub-nav a svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hub-nav a:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}.hub-nav a.hub{background:var(--accent-bg);border-color:transparent;color:var(--accent)}.hub-nav a.hub:hover{border-color:var(--accent)}
</style>
</head>

 exist to reuse.","options":["C"],"judgment":true}],"recommended":"A","recommendation":"Port first, as Matt ordered: it is one to two sessions, it lands flow in the comparison database before HX-1 changes 19g, and its one snag (17c) has a ready workaround. Then HX-1, which now has a real validation target in the Tupin and Ohta refit of Castro.","confidence":"lean","change_mind":"If the heat-exchanger user is waiting, or Matt wants the Castro P-gap closed before more data goes to Vault, B goes first: the kernel is ready and the Tupin and Ohta β values make it testable now.","chosen":"E","reason":"neither, I actually want to look into a curvature visualization toggle for the lab. Which made me think of other visualization toggles we could swap into for the main page of the lab rather than just the \"shader\" view","decided_on":"2026-11-06","superseded_by":null,"challenge":null,"settles":[],"_file":"0001-next-up-after-v0-34.html"},{"id":2,"slug":"geometry-view-picker-scope","title":"Which views should the Geometry tab's picker offer first?","date":"2026-11-06","mode":"quick","lenses":["ui","solver"],"status":"decided","context":"The Geometry tab only shows the shaded view. A scratch test showed curvature can be read from the viewer's stored field to 1–2 % at 48³ with a two-voxel sampling step, so geometry readouts need no solver or re-bake.","depends_on":[1],"conflicts":[],"options":[{"key":"A","name":"Four-view picker","summary":"Shaded plus Curvature, Overhang, Wall thickness and Pore size, sharing one colour bar and control row. About 1–2 sessions.","pros":["All four concern printability and pore geometry and are built the same way."],"cons":["Thickness and pore size add a shader loop, which needs a compile check on Windows."],"source":"claude"},{"key":"B","name":"Curvature only","summary":"The smallest version, under a session.","pros":["Quickest answer to a curvature question."],"cons":["The picker work gets revisited as soon as a second view arrives."],"source":"claude"},{"key":"C","name":"All seven views","summary":"Also Surface direction, X-ray and Networks. About 3–4 sessions.","pros":["Most complete."],"cons":["X-ray and Networks each need their own mechanism."],"source":"claude"}],"recommended":"A","recommendation":"All four share one purpose and one mechanism.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-06","superseded_by":null,"challenge":null,"settles":[{"key":"curvature sign","value":"positive = convex solid, outward normal out of the solid"}],"_file":"0002-geometry-view-picker-scope.html"},{"id":3,"slug":"hx1-reaching-reynolds","title":"How should the flow solver reach heat-exchanger Reynolds numbers?","date":"2026-11-11","mode":"full","lenses":["solver","architecture"],"status":"decided","context":"HX-1 needs flow at pore Reynolds numbers of about 1–100 (Castro et al. 2019 ran at 29–145; heat exchangers 10–500). The GPU kernel in 19g already solves the full Navier–Stokes equations (its equilibrium keeps the quadratic velocity terms), so no physics is missing: today it simply runs very slowly (lattice speed about 0.01) in a very viscous lattice fluid (relaxation time 1.5), which puts the Reynolds number well below 1. Reaching Re 100 means a faster lattice flow and a much less viscous lattice fluid, and the question is whether the present collision rule (two relaxation times, TRT) holds up there or a new, more stable rule is needed. Either way the creeping-flow path the cards, sweep and Sweep port use stays exactly as it is.","depends_on":[],"conflicts":[],"log_refs":[{"file":"docs/FLUIDS_LBM_SCOPE.md","entry":"§3.1 TRT with magic parameter 3/16; §11.2 HX-1 lattice limits (speed ≤ 0.1, relaxation time clear of ½, Re near 100 at 64³)"},{"file":"docs/FLUIDS_LBM_SCOPE.md","entry":"§12 check F3: TRT + CLI walls keep permeability to 2 ppm across relaxation times 0.6–2.0"}],"options":[{"key":"A","name":"Same kernel, viscosity set per point","summary":"Keep D3Q19, TRT and CLI walls. Each Reynolds point keeps the lattice flow at about 0.03 mean pore speed (peaks near 0.1; compressibility error scales with the speed squared, a few tenths of a percent at the mean speed, checked on a straight channel where the exact answer has no inertia at all) and lowers the relaxation time toward 0.51 to reach its Reynolds number. The magic parameter (3/16 now, or 1/4, which is more stable for fast flow) is settled by a GPU bench before coding.","pros":["No new kernel: every check already passed (F1–F11, W1–W5) still describes the code that runs.","TRT with CLI walls keeps the wall in place whatever the relaxation time (check F3, 2 ppm), so the answer depends on the Reynolds number alone and changing viscosity per point is safe.","The grid, not stability, is the real ceiling: at 64³ a 70 % gyroid has about 29 cells across its pores, and the boundary layers at Re 100 are already only about 3 cells thick. A more stable rule would mostly buy points the grid cannot resolve.","A console bench on today's main (no code change) can measure stability, steps and time at Re 1–200 before anything is built."],"cons":["Close to a relaxation time of ½, TRT can go unstable at sharp strut edges; the cap (Re about 100 at 64³, about 400 at 128³) is an estimate until the bench runs.","A less viscous lattice fluid settles more slowly: steps per point grow roughly as one over the viscosity, so the top point costs about 10–40 times what a creeping-flow solve does.","If the bench shows instability below Re 100 at 64³, this option needs the 1/4 parameter or a cap lower than users want."],"effort":"No extra effort beyond HX-1 itself (about 3 sessions in all); half an hour of Matt's time for the GPU bench.","source":"claude"},{"key":"B","name":"New, more stable collision rule","summary":"Replace TRT for inertial runs with a cumulant or regularized collision rule, which stays stable much closer to zero viscosity and is the usual choice for higher-Reynolds lattice Boltzmann work. Creeping flow keeps TRT.","pros":["More headroom against blow-ups at sharp edges and thin throats.","Opens a path to the top of the heat-exchanger range (Re 200–500) on finer grids later."],"cons":["Two kernels to keep: the GPU step, stress and velocity shaders and the Float64 CPU reference all need a second version, and the wall checks (F1–F7, W1–W4) must be re-run and may fail as Bouzidi walls did with TRT.","The proven property that the wall stays put as viscosity changes is specific to TRT with a fixed magic parameter; a new rule needs its own proof.","Stability past the grid limit buys little accuracy: under-resolved boundary layers give stable but wrong pressure drop.","A new collision operator is a larger change than the request needs, before any measurement says TRT is not enough."],"effort":"About 2 extra sessions on top of HX-1, mostly re-validation.","source":"claude"}],"criteria":[{"name":"Physical fidelity","scores":{"A":3,"B":3},"note":"both are full Navier–Stokes; accuracy is set by the grid in both"},{"name":"Run time","scores":{"A":2,"B":2},"note":"settling time is physics, not the collision rule"},{"name":"Robustness near the top point","scores":{"A":2,"B":3}},{"name":"Validation effort","scores":{"A":3,"B":1},"note":"A reuses every passed check"},{"name":"Credibility to a reviewer","scores":{"A":3,"B":2},"note":"TRT + interpolated walls is the documented porous-media standard (Khirevich et al. 2015)"}],"recommended":"A","recommendation":"The grid limits accuracy before TRT's stability does, so a new collision rule would mostly buy points the grid cannot resolve. Bench first; move to B only if TRT blows up below Re 100 at 64³.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"lattice Boltzmann collision for inertial flow","value":"D3Q19 TRT with CLI interpolated walls (no new collision operator); Reynolds number reached by lowering the relaxation time per point at a mean pore lattice speed of about 0.03; magic parameter 3/16, or 1/4 if the GPU bench shows it is needed"}],"_file":"0003-hx1-reaching-reynolds.html"},{"id":4,"slug":"hx1-results-storage","title":"How should pressure-drop results be stored next to the creeping-flow results?","date":"2026-11-11","mode":"full","lenses":["data-model","architecture"],"status":"decided","context":"Today one flow record per design (FLOW_BY_DESIGN) holds permeability, wall shear per unit force and the velocity fields; it is cached on geometry, grid and tolerance only, because in creeping flow speed, fluid and viscosity are pure rescales. That stops being true once inertia matters: every Reynolds number is its own solve. But one thing carries over: for a given geometry the pressure drop in dimensionless form (friction factor against Reynolds number) does not depend on the fluid or the cell size. So the same 'solve once, change the fluid live' behaviour is possible if the results are stored dimensionless. HX-2 (heat transfer) will run on each converged HX-1 flow, so the storage also decides whether HX-2 needs the velocity fields kept or can work while they are still on the GPU.","depends_on":[3],"conflicts":[],"log_refs":[{"file":"docs/FLUIDS_LBM_SCOPE.md","entry":"§3.10 cache signature excludes fluid and flow settings; §11.4 sweep columns and the long-format CSV (decided 2026-10-07)"},{"file":"docs/NEXT_STEPS.md","entry":"F13LD.sweep flow port copies 19g; HX-1 must not change what it copies"}],"options":[{"key":"A","name":"Own record, stored dimensionless","summary":"A separate pressure-drop record per design, with its own run step after Flow and its own cache (geometry, grid, Reynolds list, version). Per open axis it keeps each point's Reynolds number, dimensionless pressure gradient, steps, converged and unsteady flags, plus the hydraulic diameter. Fluid, cell size and speed units only change the display, live. The creeping-flow record and its code stay byte-identical.","pros":["Nothing already validated moves: cards, sweep CSV with HX off, the Sweep port's copy of 19g and every cached flow result stay as they are (an F14-style check proves it).","Changing the fluid (air, water, glycol, oil) or cell size never re-solves; only editing the Reynolds list does.","Dimensionless points are exactly what a surrogate database trains on, and the long-format CSV (one row per design × axis × Reynolds number, decided 2026-10-07) is a direct dump.","A per-point hook after each converged flow lets HX-2 run its heat-transfer lattice on the populations still on the GPU, so no velocity fields need storing now."],"cons":["A second record, cache key and run step to keep in step with the first (it reads K and the hydraulic diameter from the creeping-flow run, so Flow must run first).","Wall shear at speed and the flow view at a chosen Reynolds number are not kept in HX-1; they would need fields stored per point later."],"effort":"Part of HX-1; about half a session of the 3.","source":"claude"},{"key":"B","name":"Inside the existing flow record","summary":"Add the Reynolds points to the present flow record and fold the Reynolds list into its cache key, so one Flow run does both.","pros":["One run step and one record: less code around the solver.","One place to look for everything about a design's flow."],"cons":["Editing the Reynolds list re-solves permeability and wall shear too.","The flow version must change, so every cached flow result re-solves once and the Sweep port copies a moving file.","Mixes per-unit-force results (rescale freely) with per-Reynolds results (do not), which invites a wrong rescale in the cards."],"effort":"Slightly less than A.","source":"claude"},{"key":"C","name":"Physical units per fluid","summary":"Store pressure drop in Pa/m at chosen speeds for the selected fluid and cell size, as an engineer would read a test report.","pros":["Numbers read directly as a test report would."],"cons":["Every change of fluid or cell size re-solves, although the physics says it need not.","Surrogate pipelines would have to convert back to dimensionless form.","Display in Pa/m is available in A anyway, computed live."],"effort":"Similar to A, but slower to use.","source":"claude"}],"criteria":[{"name":"Keeps validated results unchanged","scores":{"A":3,"B":1,"C":3}},{"name":"Live fluid and cell-size changes","scores":{"A":3,"B":3,"C":1}},{"name":"Fit for the surrogate database","scores":{"A":3,"B":2,"C":1}},{"name":"Room for HX-2","scores":{"A":3,"B":2,"C":1},"note":"A plans the per-point hook"},{"name":"Code to maintain","scores":{"A":2,"B":3,"C":2}}],"recommended":"A","recommendation":"It keeps every validated result and the Sweep port untouched, keeps fluid changes live by storing the physics' own dimensionless form, and leaves HX-2 a clean place to attach.","confidence":"strong","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"inertial flow results storage","value":"own versioned record per design, separate from creeping flow; per axis and point: Reynolds number on the hydraulic diameter with interstitial speed, dimensionless pressure gradient (Darcy-normalised resistance), steps, convergence and unsteady flags; fluid, cell size and units are display-only"}],"_file":"0004-hx1-results-storage.html"},{"id":5,"slug":"hx1-default-run","title":"What should one pressure-drop run cover by default?","date":"2026-11-11","mode":"full","lenses":["research","solver","ui"],"status":"decided","context":"Run time is set by how many Reynolds points, how many flow directions and which grid. Low points are cheap (the lattice fluid stays viscous and settles in a few thousand steps); the top point dominates, because a less viscous lattice fluid settles slowly. Rough figures at 64³ on Matt's RTX (about 27,000 steps a second from the 2026-10-14 bench): Re up to 10 well under 0.2 s a point, Re 20–50 about 1 s, Re 100 about 1.5–3 s with a warm start from the previous point. At 128³ the same top point is one to two minutes. These are estimates for the bench to confirm. The scope (§11.7, 2026-10-07) said to wait for the database user's operating range before fixing defaults; this sets a provisional, editable default and needs no answer from him to start.","depends_on":[3,4],"conflicts":[],"log_refs":[{"file":"docs/FLUIDS_LBM_SCOPE.md","entry":"§11.2 default list 1, 10, 50, 100, 200; §11.7 Reynolds list waits for the user's answer"},{"file":"docs/FLUIDS_LBM_SCOPE.md","entry":"§15 Flow direction setting: Z / X / Y / All"}],"options":[{"key":"A","name":"Six points to Re 100, chosen direction, 64³","summary":"Reynolds numbers 2, 5, 10, 20, 50 and 100 (editable list), solved along the Flow direction setting (All = the three axes), on the flow grid. Points above what the grid resolves are skipped with a note; 128³ is allowed with a time warning.","pros":["Fits the 10–20 s budget: about 3–6 s per direction, 10–20 s with All, plus the wall links Flow already builds.","Dense where inertia switches on (Re about 2–20), which is where the inertia-onset number and the fit's quality are decided.","Covers Castro et al.'s 29–145 except its top, and the bottom half of the heat-exchanger range.","A heat exchanger has a known flow direction, so one axis is often all a user needs (3× faster)."],"cons":["Stops at Re 100: the upper heat-exchanger range (200–500) needs 128³ and minutes per design.","Six points, not the scope's five; the list differs from the 2026-10-07 draft."],"effort":"Same build as the others.","source":"claude"},{"key":"B","name":"Scope list on all three axes","summary":"Reynolds numbers 1, 10, 50, 100 and 200 as written in the scope, on every open axis, with Re 200 on a 128³ grid.","pros":["Matches the scope as written in 2026-10-07.","Reaches Re 200, further into the heat-exchanger range."],"cons":["Re 200 on all three axes at 128³ is several minutes per design: outside the 10–20 s budget.","Only one point (Re 1–10) where inertia switches on, so the onset number is poorly placed.","Re 1 adds nothing the creeping-flow run does not already give."],"effort":"Same build; much longer runs.","source":"claude"},{"key":"C","name":"Automatic to what the grid resolves","summary":"No list: points spaced evenly on a log scale from Re 1 up to the highest Reynolds number the chosen grid resolves for that design (about 100 at 64³, about 400 at 128³), on every open axis.","pros":["Nothing to set: every design gets the widest range its grid supports.","The top point is always one the grid can resolve."],"cons":["Designs in a sweep end up on different Reynolds points, so columns at a fixed Re need interpolation.","All axes at 128³ runs into minutes per design.","Less predictable for a user who wants a specific operating point."],"effort":"Same build plus a grid-cap estimate per design.","source":"claude"}],"criteria":[{"name":"Run time within 10–20 s","scores":{"A":3,"B":1,"C":2}},{"name":"Reynolds range covered","scores":{"A":2,"B":3,"C":3}},{"name":"Inertia onset well placed","scores":{"A":3,"B":1,"C":2}},{"name":"Sweep columns comparable across designs","scores":{"A":3,"B":3,"C":1}},{"name":"Predictable for the user","scores":{"A":3,"B":3,"C":2}}],"recommended":"A","recommendation":"It keeps a normal Lab run inside the 10–20 s budget, puts its points where inertia switches on, and leaves Re 200 and above as a deliberate, slower 128³ choice. Confirm with the bench numbers before building.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"default Reynolds points for pressure drop","value":"2, 5, 10, 20, 50, 100 (hydraulic diameter, interstitial speed), editable, along the chosen flow direction (All = three axes), 64³ flow grid; higher points only at 128³ with a time warning"}],"_file":"0005-hx1-default-run.html"}]</script>
<script>
const ALL = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(4,'0');
const ic = d => `<svg class="icon" viewBox="0 0 24 24">${d}</svg>`;
const I = {
  flag: ic('<path d="M6 21V4M6 4h11l-2 4 2 4H6"/>'),
  alert: ic('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/>'),
  eye: ic('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>'),
  split: ic('<path d="M12 21v-7M12 14L6 6M12 14l6-8M6 6V3M18 6V3"/>'),
  check: ic('<circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.2l2.6 2.6 4.9-5.2"/>'),
  archive: ic('<rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4"/>'),
  grid: ic('<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>'),
  layers: ic('<path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/>'),
  tree: ic('<circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M8.2 6.6C13 8 13 11 15.8 11.6M8.2 17.4C13 16 13 13 15.8 12.4"/>'),
  clock: ic('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  bars: ic('<path d="M4 20h16M7 20v-7M12 20V6M17 20v-10"/>')
};
// One state per decision drives every colour on the page.
const STATES = [
  { k:'openitem', name:'Open item', hint:'Flagged for review in the repo’s own log', c:'var(--bad)', icon:I.flag, test:d => d.open_item && (d.status==='found'||d.status==='open') },
  { k:'strained', name:'Strained', hint:'Deliberate, but now causing cost or risk', c:'var(--warn)', icon:I.alert, test:d => d.holding_up==='strained' && d.status!=='superseded' && d.status!=='rejected' },
  { k:'open', name:'Needs your call', hint:'Open decisions waiting for a pick', c:'var(--accent)', icon:I.split, test:d => d.status==='open' || (d.status==='parked' && due(d)) },
  { k:'review', name:'Needs review', hint:'Found in the code, waiting to be confirmed', c:'#b49cff', icon:I.eye, test:d => d.status==='found' },
  { k:'parked', name:'Parked', hint:'Set aside until a date or a trigger', c:'#7f8aa3', icon:I.clock, test:d => d.status==='parked' },
  { k:'decided', name:'Decided', hint:'Confirmed or picked', c:'var(--good)', icon:I.check, test:d => d.status==='decided' },
  { k:'history', name:'History', hint:'Superseded or rejected', c:'var(--hist)', icon:I.archive, test:d => d.status==='superseded' || d.status==='rejected' }
];
const today = new Date().toISOString().slice(0,10);
function due(d){ return !!(d.revisit && d.revisit.date && d.revisit.date <= today); }
const stateOf = d => STATES.find(s => s.test(d)) || STATES[3];
ALL.forEach(d => d._s = stateOf(d));
const repoName = (location.pathname.split('/').slice(-3,-2)[0] || '');
document.getElementById('repo').textContent = repoName ? '· ' + decodeURIComponent(repoName) : '';

function sub(){
  const counts = STATES.map(s => [s, ALL.filter(d => d._s===s).length]).filter(([,n]) => n);
  document.getElementById('sub').innerHTML = `<span>${ALL.length} decision${ALL.length===1?'':'s'}</span>` + counts.map(([s,n]) => `<span><span class="dot" style="background:${s.c}"></span>${n} ${s.name.toLowerCase()}</span>`).join('');
}

function glance(list){
  const total = list.length || 1;
  const counts = STATES.map(s => [s, list.filter(d => d._s===s).length]).filter(([,n]) => n);
  const bar = `<div class="bar">${counts.map(([s,n]) => `<span style="width:${n/total*100}%;background:${s.c}" title="${n} ${esc(s.name)}"></span>`).join('')}</div>
    <div class="legend">${counts.map(([s,n]) => `<span><i style="background:${s.c}"></i>${n} ${esc(s.name.toLowerCase())}</span>`).join('')}</div>`;
  const tiles = `<div class="tiles">${[...list].sort((a,b)=>a.id-b.id).map(d => `<a class="tile" style="--c:${d._s.c}" href="${esc(d._file)}" title="${pad(d.id)} ${esc(d.title)} · ${esc(d._s.name)}">${pad(d.id).replace(/^0+(?=\d{2})/,'')}<small>${esc(shortTitle(d))}</small></a>`).join('')}</div>`;
  const lenses = [...new Set(list.flatMap(d => d.lenses||[]))].sort();
  const areas = `<div class="areas">${lenses.map(l => { const ds = list.filter(d => (d.lenses||[]).includes(l)).sort((a,b)=>STATES.indexOf(a._s)-STATES.indexOf(b._s)); return `<div class="area"><span>${esc(l)}</span><span class="pips">${ds.map(d => `<a style="--c:${d._s.c}" href="${esc(d._file)}" title="${pad(d.id)} ${esc(d.title)}"></a>`).join('')}</span><span class="n">${ds.length}</span></div>`; }).join('')}</div>`;
  return `<div class="glance">
    <div class="panel"><div class="ptitle">${I.bars}Where things stand</div>${bar}<div style="margin-top:14px">${tiles}</div></div>
    <div class="panel"><div class="ptitle">${I.layers}By area</div>${areas || '<div class="muted">No areas tagged</div>'}</div>
  </div>`;
}
function shortTitle(d){
  const o = (d.options||[]).find(x => x.key === (d.chosen || d.recommended));
  return (o ? o.name : d.title).split(/[;,:(]/)[0];
}

function card(d){
  const o = (d.options||[]).find(x => x.key === d.chosen);
  let line = '';
  if (d.holding_up==='strained' && d.strain) line = `<div class="line warn">${esc(d.strain)}</div>`;
  else if (d.status==='decided' && o) line = `<div class="line ok">${esc(d.chosen)}: ${esc(o.name)}${d.reason?` <span class="muted">· ${esc(d.reason)}</span>`:''}</div>`;
  else if (d.status==='superseded') line = `<div class="line">Replaced by ${pad(d.superseded_by)}</div>`;
  else if (d.status==='parked') { const rv = d.revisit||{}; line = `<div class="line${due(d)?' warn':''}">${due(d)?'Revisit due':'Back'} ${rv.date?esc(rv.date):''}${rv.date&&rv.trigger?' or ':''}${rv.trigger?esc(rv.trigger):''}</div>`; }
  else if (d.status==='rejected') line = `<div class="line">Dropped${d.reason?`: ${esc(d.reason)}`:''}</div>`;
  else { const r = (d.options||[]).find(x => x.key === d.recommended); if (r) line = `<div class="line">${d.status==='found'?'In the code':'Leaning'}: ${esc(r.name)}</div>`; }
  return `<a class="dcard" href="${esc(d._file)}"><div class="row" style="gap:6px"><span class="num">${pad(d.id)}</span>${d.open_item?`<span class="chip bad">open item</span>`:''}${d.status==='parked'&&due(d)?'<span class="chip found">revisit due</span>':''}${d.deep?'<span class="chip open">deep</span>':''}</div><div class="t">${esc(d.title)}</div>${line}<div class="chips">${(d.lenses||[]).map(l=>`<span class="chip">${esc(l)}</span>`).join('')}</div></a>`;
}

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const CHEV = '<svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const laneKey = 'crux.repo.' + (repoName || 'repo') + '.openLanes';
let openLanes = new Set(store.get(laneKey) || []);
const CAP = { decided: 3, history: 3 };
function lanes(list, searching){
  const ls = STATES.map(s => [s, list.filter(d => d._s===s).sort((a,b)=>b.id-a.id)]).filter(([,ds]) => ds.length);
  return `<div class="lanes">${ls.map(([s,ds]) => {
    const cap = CAP[s.k] || 5;
    const all = searching || openLanes.has(s.k);
    const shown = all ? ds : ds.slice(0, cap);
    const more = ds.length - shown.length;
    return `<section class="lane" style="--c:${s.c}"><div class="lhead">${s.icon}${esc(s.name)} <span class="count">${ds.length}</span></div><div class="lhint">${esc(s.hint)}</div><div class="cards">${shown.map(card).join('')}</div>${more>0?`<button class="more" data-lane="${s.k}">${CHEV}Show ${more} more</button>`:(!searching && ds.length > cap ? `<button class="more less" data-lane="${s.k}">${CHEV}Show fewer</button>` : '')}</section>`;
  }).join('')}</div>`;
}
document.getElementById('out').addEventListener('click', e => {
  const lb = e.target.closest('[data-lane]');
  if (lb){ const k = lb.dataset.lane; openLanes.has(k) ? openLanes.delete(k) : openLanes.add(k); store.set(laneKey, [...openLanes]); render(); }
});

function depMap(all){
  let list = all;
  const ids = new Set(all.map(d => d.id));
  const byId = new Map(all.map(d => [d.id, d]));
  const deps = d => (d.depends_on||[]).filter(n => ids.has(n));
  const linked = new Set(list.flatMap(d => deps(d).length ? [d.id, ...deps(d)] : []));
  if (!linked.size) return '';
  const loose = list.filter(d => !linked.has(d.id)).length;
  list = list.filter(d => linked.has(d.id));
  const depth = new Map();
  const dep = (d, seen = new Set()) => { if (depth.has(d.id)) return depth.get(d.id); if (seen.has(d.id)) return 0; seen.add(d.id); const v = deps(d).length ? 1 + Math.max(...deps(d).map(n => dep(byId.get(n), seen))) : 0; depth.set(d.id, v); return v; };
  list.forEach(d => dep(d));
  const cols = Math.max(...depth.values()) + 1;
  const colItems = [];
  const rowOf = new Map();
  for (let c = 0; c < cols; c++) {
    const items = list.filter(d => depth.get(d.id) === c);
    const key = d => { const ps = deps(d).map(n => rowOf.get(n)).filter(v => v != null); return ps.length ? ps.reduce((a,b)=>a+b,0)/ps.length : d.id/1000; };
    items.sort((a,b) => key(a) - key(b) || a.id - b.id);
    items.forEach((d, i) => rowOf.set(d.id, i));
    colItems.push(items);
  }
  const W = 190, H = 46, GX = 70, GY = 14, PAD = 6;
  const rows = Math.max(...colItems.map(c => c.length));
  const pos = new Map();
  colItems.forEach((c, ci) => c.forEach((d, ri) => pos.set(d.id, { x: PAD + ci*(W+GX), y: PAD + ri*(H+GY) })));
  const vw = PAD*2 + cols*W + (cols-1)*GX, vh = PAD*2 + rows*H + (rows-1)*GY;
  let edges = '', nodes = '';
  for (const d of list) for (const n of deps(d)) {
    const a = pos.get(n), b = pos.get(d.id);
    const x1 = a.x+W, y1 = a.y+H/2, x2 = b.x, y2 = b.y+H/2;
    let path;
    if (b.x - a.x <= W + GX) { const mx = (x1+x2)/2; path = `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2-6} ${y2}`; }
    else {
      // Long edge: drop into the gap between rows so it never runs behind a box.
      const yg = b.y > PAD ? b.y - GY/2 : b.y + H + GY/2;
      const g1 = x1 + GX/2, g2 = x2 - GX/2;
      path = `M${x1} ${y1}C${g1} ${y1} ${x1} ${yg} ${g1} ${yg}L${g2} ${yg}C${x2} ${yg} ${g2} ${y2} ${x2-6} ${y2}`;
    }
    edges += `<path d="${path}" fill="none" stroke="var(--faint)" stroke-width="1.3" marker-end="url(#ah)"/>`;
  }
  for (const d of list) { const p = pos.get(d.id); const t = shortTitle(d); nodes += `<a href="${esc(d._file)}"><title>${pad(d.id)} ${esc(d.title)}</title><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8" fill="var(--surface)" stroke="var(--line2)"/><rect x="${p.x}" y="${p.y+8}" width="3" height="${H-16}" rx="1.5" fill="${d._s.c}"/><text x="${p.x+12}" y="${p.y+19}" font-size="11" font-family="var(--mono)" fill="var(--faint)">${pad(d.id)}</text><text x="${p.x+12}" y="${p.y+35}" font-size="12.5">${esc(t.length > 26 ? t.slice(0,25)+'…' : t)}</text></a>`; }
  return `<h2 class="row" style="gap:7px">${I.tree}What builds on what</h2><div class="panel map"><svg viewBox="0 0 ${vw} ${vh}" style="max-width:${vw}px" role="img" aria-label="Dependency map of decisions"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--faint)" stroke-width="1.5"/></marker></defs>${edges}${nodes}</svg><div class="legend" style="margin-top:8px">Left to right: foundations first. ${loose ? `${loose} decision${loose===1?' stands':'s stand'} on ${loose===1?'its':'their'} own and ${loose===1?'is':'are'} not shown here.` : ''}</div></div>`;
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = ALL.filter(d => !q || JSON.stringify([d.title,d.context,d.reason,d.strain,(d.lenses||[]),(d.options||[]).map(o=>o.name+' '+o.summary)]).toLowerCase().includes(q));
  if (!list.length){ document.getElementById('out').innerHTML = `<div class="empty">${ALL.length ? 'No matches' : 'No decisions yet'}</div>`; return; }
  document.getElementById('out').innerHTML = glance(list) + `<h2 class="row" style="gap:7px">${I.grid}Board</h2>` + lanes(list, !!q) + depMap(list);
}
sub();
document.getElementById('q').addEventListener('input', render);
render();
</script>
<script>
// Links to the Crux hub: shown when the page comes from the hub, or when a running hub answers on this machine.
(() => {
  const show = (id, href) => { const a = document.getElementById(id); if (a) { if (href) a.href = href; a.hidden = false; } };
  if (location.protocol !== 'file:') { show('hub-link', '/'); show('all-link', '/all'); return; }
  fetch('http://localhost:4747/api/ping').then(r => { if (r.ok) show('hub-link'); }).catch(() => {});
})();
</script>
