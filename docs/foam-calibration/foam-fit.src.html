<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F13LD Foam Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* F13LD.foam calibration fit — F13LD.lab docs/foam-calibration (2026-10-03).
   Self-contained: drop the lab's sweep export(s) here; everything runs in the page. */
:root{
  color-scheme: dark;
  --ground:#06080c; --panel:#0c1016; --panel-2:#11161d; --line:#1b2229; --line-2:#27303a;
  --text:#e8ecef; --text-2:#a3acb4; --muted:#68727b;
  --jade:#1D9E75; --lime:#c8f542; --warn:#e8b04a; --bad:#e66767;
  --s-open:#3987e5; --s-closed:#d95926; --s-plateau:#1D9E75; --s-lattice:#8a939b; --s-lit:#7b858e;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; --sans:'Exo 2',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;gap:14px;padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.wm{font-weight:700;letter-spacing:.06em;font-size:18px}.wm .j{color:var(--jade)}.wm .l{color:var(--lime)}
.tool{font-weight:600;letter-spacing:.14em;color:var(--text-2);font-size:13px;border-left:1px solid var(--line-2);padding-left:14px}
.sub{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:auto}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:600;margin:28px 0 10px}
h3{font-size:14px;margin:0 0 4px;font-weight:600}
p.note,.note{color:var(--text-2);font-size:13px;margin:4px 0 10px;max-width:880px}
.drop{border:1px dashed var(--line-2);border-radius:10px;padding:16px;background:var(--panel);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.drop.hot{border-color:var(--jade);background:#0d1a16}
.btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;border:1px solid var(--jade);background:rgba(29,158,117,.1);color:var(--jade);cursor:pointer}
.btn:hover{background:rgba(29,158,117,.2)} .btn.ghost{border-color:var(--line-2);color:var(--text-2);background:none}
.files{font-family:var(--mono);font-size:11px;color:var(--text-2);display:flex;flex-direction:column;gap:2px}
.files .x{color:var(--muted);cursor:pointer;margin-left:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card .v{font-family:var(--mono);font-size:15px;margin-top:4px;color:var(--text)}
.card .d{font-size:12px;color:var(--text-2);margin-top:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:14px}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 12px 6px;min-width:0}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{font-size:12px;color:var(--text-2);margin:2px 4px 8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2);margin:2px 4px 6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.fig .legend svg{width:14px;height:14px;flex:none}
svg text{font-family:var(--mono);font-size:10.5px;fill:var(--text-2)}
svg .ax{stroke:var(--line-2);stroke-width:1}
svg .gr{stroke:var(--line);stroke-width:1}
svg .lab{fill:var(--text-2);font-family:var(--sans);font-size:11.5px}
svg .dl{font-family:var(--sans);font-size:11px;fill:var(--text)}
svg .hit{fill:transparent;cursor:crosshair}
.tip{position:fixed;pointer-events:none;background:#0a0e13;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--text);z-index:9;display:none;max-width:360px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tip b{color:var(--lime);font-weight:500}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px}
th{position:sticky;top:0;background:var(--panel-2);color:var(--text-2);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.l{text-align:left}
tr:hover td{background:#0f141a}
.tbl{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.flag{color:var(--warn)} .bad{color:var(--bad)} .ok{color:var(--jade)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);font-size:13px;padding:24px;text-align:center}
code{font-family:var(--mono);font-size:12px;color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="wm"><span class="j">F</span><span class="l">13</span><span class="j">LD</span></div>
  <div class="tool">FOAM FIT</div>
  <div class="sub">F13LD.foam stiffness calibration · F13LD.lab sweep exports</div>
</header>

<div class="drop" id="drop">
  <button class="btn" id="pick">Load results CSV…</button>
  <input type="file" id="file" accept=".csv" multiple hidden>
  <div class="note" style="margin:0">Drop one or more F13LD.lab sweep exports here (results CSVs). Run-matrix CSVs are recognised too; the two foam study matrices are built in. A later file replaces earlier rows with the same run id.</div>
  <div class="files" id="files"></div>
</div>

<div id="out"><div class="empty">No results loaded yet.</div></div>
</div>
<div class="tip" id="tip"></div>

<script id="runs-calibration" type="text/csv">__RUNS_CALIBRATION__</script>
<script id="runs-plateau" type="text/csv">__RUNS_PLATEAU__</script>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   Data
   ════════════════════════════════════════════════════════════ */
var RUNS = {};          // run_id -> run-matrix row
var RESULTS = {};       // run_id -> results row (+ _file)
var FILES = [];         // [{name, kind, n}]

function parseCsv(text) {
  var rows = [], row = [], cur = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  var h = rows[0].map(function (s) { return s.trim(); });
  return rows.slice(1).map(function (r) { var o = {}; h.forEach(function (k, j) { o[k] = (r[j] || '').trim(); }); return o; });
}
function num(v) { var x = parseFloat(v); return isFinite(x) ? x : NaN; }
function ingest(text, name) {
  var rows = parseCsv(text);
  if (!rows.length) throw new Error(name + ': empty');
  var h = rows[0];
  if ('Ex' in h && 'run_id' in h) {
    rows.forEach(function (r) { r._file = name; RESULTS[r.run_id] = r; });
    FILES.push({ name: name, kind: 'results', n: rows.length });
  } else if ('seed_mode' in h && 'run_id' in h) {
    rows.forEach(function (r) { RUNS[r.run_id] = r; });
    FILES.push({ name: name, kind: 'run matrix', n: rows.length });
  } else throw new Error(name + ': not a sweep export or foam run matrix');
}
['runs-calibration', 'runs-plateau'].forEach(function (id) {
  var t = document.getElementById(id).textContent.trim();
  if (t && t.indexOf('__RUNS_') !== 0) parseCsv(t).forEach(function (r) { RUNS[r.run_id] = r; });
});

/* ════════════════════════════════════════════════════════════
   Analysis
   ════════════════════════════════════════════════════════════ */
var AX = ['Ex', 'Ey', 'Ez'], SH = ['Gyz', 'Gxz', 'Gxy'];
function avg(a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; }
function mean3(r, pref, qs) { return avg(qs.map(function (q) { return num(r[pref + q]); })); }

/* Nelder–Mead on a 2-parameter function with box clamps */
function nm2(fn, x0, lo, hi) {
  function cl(x) { return [Math.min(hi[0], Math.max(lo[0], x[0])), Math.min(hi[1], Math.max(lo[1], x[1]))]; }
  var s = [cl(x0), cl([x0[0] * 1.3 + 0.1, x0[1]]), cl([x0[0], x0[1] * 1.3 + 0.1])].map(function (x) { return { x: x, f: fn(x) }; });
  for (var it = 0; it < 400; it++) {
    s.sort(function (a, b) { return a.f - b.f; });
    var c = [(s[0].x[0] + s[1].x[0]) / 2, (s[0].x[1] + s[1].x[1]) / 2];
    var r = cl([2 * c[0] - s[2].x[0], 2 * c[1] - s[2].x[1]]), fr = fn(r);
    if (fr < s[0].f) { var e = cl([3 * c[0] - 2 * s[2].x[0], 3 * c[1] - 2 * s[2].x[1]]), fe = fn(e); s[2] = fe < fr ? { x: e, f: fe } : { x: r, f: fr }; }
    else if (fr < s[1].f) s[2] = { x: r, f: fr };
    else { var k = cl([(c[0] + s[2].x[0]) / 2, (c[1] + s[2].x[1]) / 2]), fk = fn(k);
      if (fk < s[2].f) s[2] = { x: k, f: fk };
      else s = [s[0]].concat(s.slice(1).map(function (p) { var x = cl([(p.x[0] + s[0].x[0]) / 2, (p.x[1] + s[0].x[1]) / 2]); return { x: x, f: fn(x) }; })); }
  }
  s.sort(function (a, b) { return a.f - b.f; });
  return s[0];
}
function fitRes(ids, W, Rr) {
  if (ids.length < 3) return null;
  var fn = function (q) { var e = 0; for (var i = 0; i < W.length; i++) { var m = (1 - q[0] * Math.pow(2 * W[i], -q[1])) / (1 - q[0] * Math.pow(W[i], -q[1])); e += (m - Rr[i]) * (m - Rr[i]); } return e; };
  var best = null;
  [0.5, 1, 2, 4].forEach(function (a) { [1, 2, 3].forEach(function (p) { var r = nm2(fn, [a, p], [0, 0.3], [50, 8]); if (!best || r.f < best.f) best = r; }); });
  return { a: best.x[0], p: best.x[1], rms: Math.sqrt(best.f / W.length) };
}
function linfit(x, y) { var n = x.length, mx = avg(x), my = avg(y), sxy = 0, sxx = 0; for (var i = 0; i < n; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) * (x[i] - mx); } var b = sxy / sxx; return { b: b, a: my - b * mx }; }

function analyse() {
  var ids = Object.keys(RESULTS).filter(function (k) { return RUNS[k] && !RESULTS[k].error; });
  var missing = Object.keys(RESULTS).filter(function (k) { return !RUNS[k]; });
  var D = {};
  ids.forEach(function (k) {
    var u = RUNS[k], r = RESULTS[k], t = num(u.thickness);
    var d = {
      id: k, set: u.set, topo: u.topology, seed: u.seed_mode, cells: num(u.cells), rng: u.rng_seed, k: num(u.plateau_k) || 0,
      sz: num(u.stretch_z) || 1, sx: num(u.stretch_x) || 1, sy: num(u.stretch_y) || 1, target: num(u.target_vf_pct || u.expected_vf_pct),
      w64: 2 * t * 6.4, w128: 2 * t * 12.8, file: r._file,
      rho64: num(r.vf_measured_pct) / 100, rho128: num(r.grid2_vf_measured_pct) / 100,
      E64: mean3(r, '', AX), E128: mean3(r, 'grid2_', AX), Eext: mean3(r, 'ext_', AX),
      conv: r.converged, iters: num(r.iters_total), iters2: num(r.grid2_iters), wall: num(r.wall_time_s),
      nu: avg(['nu_xy', 'nu_xz', 'nu_yz'].map(function (q) { return num(r['ext_' + q]); })),
      r: r
    };
    d.rho = isFinite(d.rho128) ? d.rho128 : d.rho64;
    d.R = d.E128 / d.E64;
    d.lattice = d.seed === 'kelvin' || d.seed === 'weairePhelan';
    D[k] = d;
  });
  /* 1. resolution models from the well-resolved disordered runs */
  function resBasis(fam, minW) {
    var s = ids.filter(function (k) { var d = D[k]; return d.topo === fam && !d.lattice && d.sz === 1 && d.sx === 1 && d.sy === 1 && d.w64 >= minW && (d.set === 'A' || d.set === 'B'); });
    return fitRes(s, s.map(function (k) { return D[k].w64; }), s.map(function (k) { return D[k].R; }));
  }
  var RM = { open: resBasis('open', 2.5), closed: resBasis('closed', 2.4) };
  RM.plateau = RM.open;
  ids.forEach(function (k) {
    var d = D[k], m = RM[d.topo] || RM.open;
    var low = d.w64 < (d.topo === 'closed' ? 2.0 : 2.5);
    function best(q) { return low && m ? num(d.r['grid2_' + q]) / (1 - m.a * Math.pow(d.w128, -m.p)) : num(d.r['ext_' + q]); }
    d.src = low ? '128 + model' : 'ext (64↔128)';
    d.low = low;
    d.ax = AX.map(best); d.sh = SH.map(best);
    d.E = avg(d.ax); d.G = avg(d.sh);
    d.Giso = isFinite(d.nu) && !low ? d.G / (d.E / (2 * (1 + d.nu))) : NaN;
    d.axisSpread = Math.max.apply(null, d.ax.map(function (v) { return Math.abs(v / d.E - 1); }));
  });
  /* 2. laws on set A */
  var A = function (t) { return ids.filter(function (k) { return D[k].set === 'A' && D[k].topo === t; }).sort(function (a, b) { return D[a].rho - D[b].rho; }); };
  var op = A('open'), cl = A('closed'), F = {};
  if (op.length >= 3) {
    var lf = linfit(op.map(function (k) { return Math.log(D[k].rho); }), op.map(function (k) { return Math.log(D[k].E); }));
    F.open = { C: Math.exp(lf.a), n: lf.b };
    F.open.law = function (r) { return F.open.C * Math.pow(r, F.open.n); };
    F.open.rms = Math.sqrt(avg(op.map(function (k) { var e = Math.log(D[k].E / F.open.law(D[k].rho)); return e * e; })));
    var nl = linfit(op.map(function (k) { return D[k].rho; }), op.map(function (k) { return D[k].nu; }));
    F.open.nu0 = nl.a; F.open.nu1 = nl.b;
    F.open.range = [D[op[0]].rho, D[op[op.length - 1]].rho];
  }
  if (cl.length >= 2) {
    var s11 = 0, s12 = 0, s22 = 0, t1 = 0, t2 = 0;
    cl.forEach(function (k) { var r = D[k].rho, e = D[k].E; s11 += r * r; s12 += r * r * r; s22 += r * r * r * r; t1 += r * e; t2 += r * r * e; });
    var det = s11 * s22 - s12 * s12;
    F.closed = { a: (t1 * s22 - t2 * s12) / det, b: (s11 * t2 - s12 * t1) / det };
    F.closed.law = function (r) { return F.closed.a * r + F.closed.b * r * r; };
    F.closed.rms = Math.sqrt(avg(cl.map(function (k) { var e = Math.log(D[k].E / F.closed.law(D[k].rho)); return e * e; })));
    var nuv = cl.filter(function (k) { return isFinite(D[k].nu) && !D[k].low; }).map(function (k) { return D[k].nu; });
    F.closed.nu = nuv.length ? avg(nuv) : NaN;
    F.closed.range = [D[cl[0]].rho, D[cl[cl.length - 1]].rho];
  }
  function law(d) { var L = d.topo === 'closed' ? F.closed : F.open; return L ? L.law(d.rho) : NaN; }
  ids.forEach(function (k) { D[k].ratio = D[k].E / law(D[k]); });
  /* realization pairs and per-axis spread (set A) */
  function pairSpread(t) { var o = []; op.concat(cl).forEach(function (k) { var d = D[k]; if (d.topo === t && /-r1$/.test(k)) { var b = D[k.replace(/-r1$/, '-r2')]; if (b) o.push(Math.abs(d.E - b.E) / (d.E + b.E)); } }); return o.length ? avg(o) : NaN; }
  if (F.open) { F.open.real = pairSpread('open'); F.open.axis = avg(op.map(function (k) { return D[k].axisSpread; })); F.open.cells = D[op[0]].cells; }
  if (F.closed) { F.closed.real = pairSpread('closed'); F.closed.axis = avg(cl.map(function (k) { return D[k].axisSpread; })); F.closed.cells = D[cl[0]].cells; }
  /* seed-mode factors: set B (Poisson) */
  function setFac(set, t) { var v = ids.filter(function (k) { return D[k].set === set && (t === 'closed' ? D[k].topo === 'closed' : D[k].topo !== 'closed'); }).map(function (k) { return D[k].ratio; }); return v.length ? avg(v) : NaN; }
  F.poisson = { open: setFac('B', 'open'), closed: setFac('B', 'closed') };
  /* stretch: each D run against the same seeds unstretched in set A */
  function base(d) { return ids.map(function (k) { return D[k]; }).filter(function (b) { return b.set === 'A' && b.topo === d.topo && b.cells === d.cells && b.rng === d.rng && Math.abs(b.target - d.target) < 0.5 && b.sz === 1; })[0]; }
  F.stretch = { open: [], closed: [] };
  ids.forEach(function (k) {
    var d = D[k]; if (d.set !== 'D') return;
    var b = base(d); if (!b) return;
    var rr = (d.ax[2] / ((d.ax[0] + d.ax[1]) / 2)) / (b.ax[2] / ((b.ax[0] + b.ax[1]) / 2));
    var gr = (((d.sh[0] + d.sh[1]) / 2) / d.sh[2]) / (((b.sh[0] + b.sh[1]) / 2) / b.sh[2]);
    (F.stretch[d.topo === 'closed' ? 'closed' : 'open']).push({ id: k, s: d.sz, ratio: rr, m: Math.log(rr) / Math.log(d.sz), g: gr, r: Math.log(gr) / Math.log(rr), meanE: d.E / b.E });
  });
  ['open', 'closed'].forEach(function (t) { var L = F.stretch[t]; if (L.length) { F.stretch[t + 'M'] = avg(L.map(function (x) { return x.m; })); F.stretch[t + 'R'] = avg(L.map(function (x) { return x.r; })); } });
  /* plateau pairs (set P): plateau run vs open run with same cells, target, seeds */
  F.plateau = [];
  ids.forEach(function (k) {
    var d = D[k]; if (d.set !== 'P' || d.topo !== 'plateau') return;
    var o = ids.map(function (j) { return D[j]; }).filter(function (b) { return b.set === 'P' && b.topo === 'open' && b.cells === d.cells && b.rng === d.rng && Math.abs(b.target - d.target) < 0.5; })[0];
    if (!o) return;
    F.plateau.push({ id: k, open: o.id, k: d.k, cells: d.cells, target: d.target, f128: d.E128 / o.E128, fbest: d.E / o.E, rho: d.rho, rhoOpen: o.rho });
  });
  /* cell count (set N + set A at the same target) */
  var byCells = {};
  ids.forEach(function (k) { var d = D[k]; if (d.set === 'N' || (d.set === 'A' && d.topo === 'open' && Math.abs(d.target - 12) < 0.5)) (byCells[d.cells] = byCells[d.cells] || []).push(d.ratio); });
  F.cells = Object.keys(byCells).map(function (c) { return { cells: +c, ratio: avg(byCells[c]), n: byCells[c].length }; }).sort(function (a, b) { return a.cells - b.cells; });
  F.lattice = ids.filter(function (k) { return D[k].lattice; }).map(function (k) { return { id: k, ratio: D[k].ratio, R: D[k].R }; });
  return { D: D, ids: ids, RM: RM, F: F, missing: missing };
}

/* ════════════════════════════════════════════════════════════
   Charts (hand-built SVG)
   ════════════════════════════════════════════════════════════ */
var COL = { open: 'var(--s-open)', closed: 'var(--s-closed)', plateau: 'var(--s-plateau)', lattice: 'var(--s-lattice)', lit: 'var(--s-lit)' };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var F = A.F, L = ['# F13LD.foam stiffness fit', '', 'Generated ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + ' from ' + FILES.filter(function (f) { return f.kind === 'results'; }).map(function (f) { return '`' + f.name + '`'; }).join(', ') + ' (' + A.ids.length + ' runs).', ''];
  if (F.open) L.push('- **Open (and plateau):** E/Es = ' + F.open.C.toFixed(3) + ' ρ^' + F.open.n.toFixed(3) + ' over ρ ' + pc(F.open.range[0]) + '–' + pc(F.open.range[1]) + ' (rms ' + pc(F.open.rms, 1) + '); ν = ' + F.open.nu0.toFixed(3) + ' ' + (F.open.nu1 < 0 ? '−' : '+') + ' ' + Math.abs(F.open.nu1).toFixed(3) + ' ρ');
  if (F.closed) L.push('- **Closed:** E/Es = ' + F.closed.a.toFixed(3) + ' ρ + ' + F.closed.b.toFixed(3) + ' ρ² over ρ ' + pc(F.closed.range[0]) + '–' + pc(F.closed.range[1]) + ' (rms ' + pc(F.closed.rms, 1) + '); ν ≈ ' + fmt(F.closed.nu));
  L.push('- **Shear:** G = E / 2(1 + ν)');
  if (A.RM.open) L.push('- **Resolution:** open p = ' + A.RM.open.p.toFixed(2) + (A.RM.closed ? ', closed p = ' + A.RM.closed.p.toFixed(2) : '') + ' (64³ → 128³ error ∝ width^−p)');
  L.push('- **Poisson ÷ Lloyd seeds:** open ' + fmt(F.poisson.open) + ', closed ' + fmt(F.poisson.closed));
  if (F.stretch.openM) L.push('- **Stretch:** Ez/Exy = s^' + F.stretch.openM.toFixed(2) + ' open, s^' + fmt(F.stretch.closedM) + ' closed');
  if (F.plateau.length) L.push('- **Plateau ÷ open at equal ρ (128³):** ' + F.plateau.map(function (x) { return x.id + ' ' + fmt(x.f128); }).join(', '));
  if (F.cells.length) L.push('- **Cell count (open 12 %, E ÷ law):** ' + F.cells.map(function (c) { return c.cells + ' cells ' + fmt(c.ratio); }).join(', '));
  L.push('', '| run | topology | seeds | cells | ρ % | E/Es | source | ÷ law | ν |', '|---|---|---|---|---|---|---|---|---|');
  A.ids.slice().sort().forEach(function (k) { var d = A.D[k]; L.push('| ' + [k, d.topo + (d.k ? ' k ' + d.k : ''), d.seed, d.cells, (100 * d.rho).toFixed(2), fmt(d.E), d.lattice ? 'not calibrated' : d.src, fmt(d.ratio), fmt(d.nu)].join(' | ') + ' |'); });
  return L.join('\n') + '\n';
}

/* ════════════════════════════════════════════════════════════
   Wiring
   ════════════════════════════════════════════════════════════ */
function loadFiles(list) {
  var n = list.length, done = 0, errs = [];
  Array.prototype.forEach.call(list, function (f) {
    var rd = new FileReader();
    rd.onload = function () { try { ingest(String(rd.result), f.name); } catch (e) { errs.push(e.message); } if (++done === n) { if (errs.length) alert(errs.join('\n')); render(); } };
    rd.readAsText(f);
  });
}
var drop = document.getElementById('drop'), fileIn = document.getElementById('file');
document.getElementById('pick').onclick = function () { fileIn.click(); };
fileIn.onchange = function () { loadFiles(fileIn.files); fileIn.value = ''; };
['dragenter', 'dragover'].forEach(function (e) { document.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add('hot'); }); });
['dragleave', 'drop'].forEach(function (e) { document.addEventListener(e, function (ev) { ev.preventDefault(); if (e === 'drop' || ev.target === document.documentElement) drop.classList.remove('hot'); }); });
document.addEventListener('drop', function (ev) { if (ev.dataTransfer && ev.dataTransfer.files.length) loadFiles(ev.dataTransfer.files); });
document.getElementById('files').addEventListener('click', function (ev) {
  var i = ev.target.getAttribute('data-i'); if (i == null) return;
  var f = FILES[+i]; FILES.splice(+i, 1);
  if (f.kind === 'results') { RESULTS = {}; var keep = FILES.slice(); FILES = []; alert('Removed ' + f.name + '. Load the other results files again to rebuild.'); FILES = keep.filter(function (x) { return x.kind !== 'results'; }); }
  render();
});
var tip = document.getElementById('tip');
document.addEventListener('mousemove', function (ev) {
  var t = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-tip');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t; tip.style.display = 'block';
  var x = ev.clientX + 14, y = ev.clientY + 14, r = tip.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
render();
</script>
